<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Loopback</title>
<style>
:root{--bg:#15171a;--panel:#1d2024;--line:#2c3036;--text:#d9dde2;--dim:#8b929b;--ok:#5bd778;--bad:#ff5a5a;--bar:#ff6a1a}
@media (prefers-color-scheme:light){:root{--bg:#e9eaec;--panel:#f6f6f7;--line:#c9ccd1;--text:#1d2024;--dim:#5d646d;--ok:#1f8a3b;--bad:#c62828;--bar:#d9500a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
h1{font-size:15px;margin:0 0 4px;letter-spacing:.08em}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.note{color:var(--dim);font-size:12px}
#state.ok{color:var(--ok)} #state.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.seg button{background:var(--bg);color:var(--dim);border:0;padding:6px 12px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--bar);color:#fff}
.seg button:disabled{cursor:wait;opacity:.6}
#peers{font-size:13px;margin-top:4px}
.meter{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;width:120px}
.meter i{display:block;height:100%;background:var(--bar);width:0}
</style>
</head>
<body>
<main>
<section>
  <h1>AUDIO LOOPBACK</h1>
  <div id="state">connecting...</div>
  <div class="note" id="fmt"></div>
  <div class="seg" id="seg">
    <button data-mode="card">Virtual Audio Interface</button>
    <button data-mode="link">Link</button>
  </div>
  <div id="peers"></div>
  <div class="note" id="modeerr"></div>
</section>
<section>
  <h2 id="tblhead">Audio hacks on the mixer</h2>
  <table>
    <thead><tr><th>Hack</th><th id="chhead">Channels</th><th>Level</th><th>Underruns</th></tr></thead>
    <tbody id="clients"></tbody>
  </table>
  <p class="note" id="none"></p>
  <p class="note" id="help"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let switching=false;
async function setMode(m){
  if(switching)return;
  switching=true;document.querySelectorAll('#seg button').forEach(b=>b.disabled=true);
  $('modeerr').textContent='';
  try{
    const r=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
    if(!r.ok)$('modeerr').textContent=(await r.text()).trim();
  }catch(e){$('modeerr').textContent='no answer'}
  switching=false;document.querySelectorAll('#seg button').forEach(b=>b.disabled=false);
  tick();
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function draw(s){
  const link=s.mode==='link';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===s.mode));
  const el=$('state');
  el.textContent=s.running?(link?'Link Audio running':'Mixer running'):(link?'Link: ':'Mixer: ')+s.state;
  el.className=s.running?'ok':'bad';
  $('fmt').textContent=s.running?(link?'':s.channels+' channels, ')+s.rate+' Hz, '+s.period+' frames per block. Slowest block '+s.worst_mix_us+' us. Write errors '+s.write_errors+'.':'';
  const pe=$('peers');
  if(link&&s.link.enabled){
    const n=s.link.peers;
    pe.textContent='Link: '+n+(n===1?' peer':' peers')+(n>0&&s.link.tempo?' - '+s.link.tempo.toFixed(2)+' BPM':'');
  }else pe.textContent='';
  $('tblhead').textContent=link?'Audio hacks on Link':'Audio hacks on the mixer';
  $('chhead').textContent=link?'Link channel':'Channels';
  $('help').textContent=link
    ?'Each audio hack is its own Link Audio channel of the peer PushHack. In Live, turn on Link and Link Audio, then give an audio track the input type PushHack and pick the hack by name. Live keeps the sound card of the Push as its output. The Virtual Audio Interface is not used.'
    :'Each audio hack plays through this mixer, so several can play at once. Pick the channel pair in the hack\'s own page. In Live, enable the pair on the Push Hack Virtual Audio input and give a track that input.';
  const tb=$('clients');tb.innerHTML='';
  s.clients.forEach(c=>{
    const tr=document.createElement('tr');
    const name=document.createElement('td');name.textContent=c.name;
    const ch=document.createElement('td');
    if(link){const k=(s.link.sinks||[]).find(x=>x.name===c.name);ch.textContent=k?(k.listening?'listening':'no listener'):'-'}
    else ch.textContent=(c.pair+1)+'-'+(c.pair+2);
    const lv=document.createElement('td');lv.innerHTML='<span class="meter"><i></i></span>';lv.querySelector('i').style.width=Math.min(100,c.peak*100)+'%';
    const un=document.createElement('td');un.textContent=c.underruns;
    tr.append(name,ch,lv,un);tb.append(tr);
  });
  $('none').textContent=s.clients.length?'':'No audio hack is connected.';
}
async function tick(){
  try{draw(await fetch('/api/status').then(r=>r.json()))}catch(e){$('state').textContent='no answer';$('state').className='bad'}
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
