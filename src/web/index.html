<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio</title>
<style>
/* Same look as Push Manager (hacks/push-manager/src/ui/app.css): dark, one blue accent. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-tap-highlight-color: transparent; }
:root {
  --black:    rgb(228, 228, 235);   /* primary text (light on dark) */
  --blue:     rgb(0, 100, 255);     /* accent / links */
  --grey:     rgb(42, 42, 46);      /* surfaces / borders */
  --grey-mid: rgb(140, 140, 150);   /* secondary text */
  --white:    rgb(22, 22, 24);      /* page background (dark) */
  --red:      rgb(254, 89, 72);
  --green:    rgb(103, 194, 58);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --px:       20px;
}
body {
  min-height: 100%;
  background: var(--white);
  color: var(--black);
  font-family: "Ableton Sans", ui-sans-serif, system-ui, -apple-system,
               BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header */
#header {
  border-bottom: 1px solid var(--grey);
  position: sticky; top: 0; z-index: 20;
  background: var(--white);
  padding: var(--safe-top) var(--px) 0;
}
.header-inner { display: flex; align-items: center; height: 52px; gap: 12px; }
.back {
  font-size: 14px; font-weight: 500; color: var(--blue); text-decoration: none;
  white-space: nowrap; flex-shrink: 0;
}
.back:hover { opacity: 0.7; }
.header-sep { color: var(--grey-mid); font-size: 14px; flex-shrink: 0; }
.crumb { font-size: 14px; white-space: nowrap; padding: 4px 2px; color: var(--black); font-weight: 500; }

/* Page */
main { padding: 16px var(--px) calc(40px + var(--safe-bot)); max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
section { background: var(--grey); padding: 16px 20px; }
h2 {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--grey-mid); margin-bottom: 12px;
}
.note { color: var(--grey-mid); font-size: 13px; margin-top: 8px; }
#state { font-size: 16px; font-weight: 500; }
#state.ok { color: var(--green); }
#state.bad { color: var(--red); }
#peers { font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }

/* Mode switch */
.seg { display: inline-flex; margin-top: 14px; border: 1px solid var(--grey-mid); }
.seg button {
  background: none; color: var(--grey-mid); border: 0; padding: 8px 16px;
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: color 0.1s, background 0.1s;
}
.seg button + button { border-left: 1px solid var(--grey-mid); }
.seg button:hover { color: var(--black); }
.seg button.on { background: var(--blue); color: #fff; }
.seg button:disabled { cursor: wait; opacity: 0.6; }
#modeerr { color: var(--red); }

/* Table */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px 8px 0; border-bottom: 1px solid var(--white); font-size: 14px; }
th { color: var(--grey-mid); font-weight: 500; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
td { font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--white); overflow: hidden; width: 120px; }
.meter i { display: block; height: 100%; background: var(--green); width: 0; }
.listen { color: var(--green); }
.nolisten { color: var(--grey-mid); }
</style>
</head>
<body>

<div id="header">
  <div class="header-inner">
    <a class="back" id="back" href="/">&lsaquo; Back</a>
    <span class="header-sep">&rsaquo;</span>
    <span class="crumb">Audio</span>
  </div>
</div>

<main>
<section>
  <h2>Output</h2>
  <div id="state">connecting...</div>
  <div class="note" id="fmt"></div>
  <div class="seg" id="seg">
    <button data-mode="card">Virtual Audio Interface</button>
    <button data-mode="link">Link</button>
  </div>
  <div id="peers"></div>
  <div class="note" id="modeerr"></div>
</section>
<section>
  <h2 id="tblhead">Audio hacks on the mixer</h2>
  <table>
    <thead><tr><th>Hack</th><th id="chhead">Channels</th><th>Level</th><th>Underruns</th></tr></thead>
    <tbody id="clients"></tbody>
  </table>
  <p class="note" id="none"></p>
  <p class="note" id="help"></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

// Back goes to Push Manager, on its own port.
$('back').href = '//' + location.hostname + ':7701/';

let switching = false;
async function setMode(m) {
  if (switching) return;
  switching = true;
  document.querySelectorAll('#seg button').forEach(b => b.disabled = true);
  $('modeerr').textContent = '';
  try {
    const r = await fetch('/api/mode', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode: m})});
    if (!r.ok) $('modeerr').textContent = (await r.text()).trim();
  } catch (e) { $('modeerr').textContent = 'no answer'; }
  switching = false;
  document.querySelectorAll('#seg button').forEach(b => b.disabled = false);
  tick();
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function draw(s) {
  const link = s.mode === 'link';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === s.mode));
  const el = $('state');
  el.textContent = s.running ? (link ? 'Link Audio running' : 'Mixer running') : (link ? 'Link: ' : 'Mixer: ') + s.state;
  el.className = s.running ? 'ok' : 'bad';
  $('fmt').textContent = s.running
    ? (link ? '' : s.channels + ' channels, ') + s.rate + ' Hz, ' + s.period + ' frames per block. Slowest block ' + s.worst_mix_us + ' us. Write errors ' + s.write_errors + '.'
    : '';
  const pe = $('peers');
  if (link && s.link.enabled) {
    const n = s.link.peers;
    pe.textContent = 'Link: ' + n + (n === 1 ? ' peer' : ' peers') + (n > 0 && s.link.tempo ? ' - ' + s.link.tempo.toFixed(2) + ' BPM' : '');
  } else pe.textContent = '';
  $('tblhead').textContent = link ? 'Audio hacks on Link' : 'Audio hacks on the mixer';
  $('chhead').textContent = link ? 'Link channel' : 'Channels';
  $('help').textContent = link
    ? 'Each audio hack is its own Link Audio channel of the peer PushHack. In Live, turn on Link and Link Audio, then give an audio track the input type PushHack and pick the hack by name. Live keeps the sound card of the Push as its output. The Virtual Audio Interface is not used.'
    : 'Each audio hack plays through this mixer, so several can play at once. Pick the channel pair in the hack\'s own page. In Live, enable the pair on the Push Hack Virtual Audio input and give a track that input.';
  const tb = $('clients');
  tb.innerHTML = '';
  s.clients.forEach(c => {
    const tr = document.createElement('tr');
    const name = document.createElement('td'); name.textContent = c.name;
    const ch = document.createElement('td');
    if (link) {
      const k = (s.link.sinks || []).find(x => x.name === c.name);
      ch.textContent = k ? (k.listening ? 'listening' : 'no listener') : '-';
      ch.className = k && k.listening ? 'listen' : 'nolisten';
    } else ch.textContent = (c.pair + 1) + '-' + (c.pair + 2);
    const lv = document.createElement('td');
    lv.innerHTML = '<span class="meter"><i></i></span>';
    lv.querySelector('i').style.width = Math.min(100, c.peak * 100) + '%';
    const un = document.createElement('td'); un.textContent = c.underruns;
    tr.append(name, ch, lv, un);
    tb.append(tr);
  });
  $('none').textContent = s.clients.length ? '' : 'No audio hack is connected.';
}

async function tick() {
  try { draw(await fetch('/api/status').then(r => r.json())); }
  catch (e) { $('state').textContent = 'no answer'; $('state').className = 'bad'; }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
