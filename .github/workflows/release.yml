name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' hack.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match hack.json version ($MODULE_VERSION)"
            echo "Update hack.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      # The mixer writes the card with ALSA, so the binary needs cgo and
      # libasound. Build it in the same Docker image the Makefile uses, so it
      # links against a glibc that Push 3's AbletonOS has (a bare go build on
      # the runner would not run on the device).
      - name: Build (cgo, via Docker)
        run: |
          mkdir -p dist/push-audio-loopback
          docker run --rm --platform linux/amd64 \
            -v "$PWD/src":/work -w /work golang:1.25-bookworm \
            sh -c "apt-get update -qq && apt-get install -qq -y libasound2-dev >/dev/null && \
              go vet ./... && go test ./... && \
              CGO_ENABLED=1 go build -ldflags '-s -w -linkmode external -extldflags -Wl,--dynamic-linker=/lib/ld-linux-x86-64.so.2' -o /work/push-audio-loopback . && \
              chmod +x /work/push-audio-loopback"
          cp src/push-audio-loopback dist/push-audio-loopback/push-audio-loopback
          cp hack.json dist/push-audio-loopback/hack.json
          # Prebuilt kernel modules (one per Push kernel version) are
          # maintainer-provided binaries, checked into ko/ — CI cannot build
          # them (needs Ableton's gitignored GPL source tarball), it only
          # packages whatever is already committed. See README.md.
          cp -r ko dist/push-audio-loopback/ko

      - name: Package
        run: tar -czf push-audio-loopback.tar.gz -C dist push-audio-loopback

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: push-audio-loopback.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json << EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/push-audio-loopback.tar.gz",
            "released_at": "${RELEASED_AT}"
          }
          EOF
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
